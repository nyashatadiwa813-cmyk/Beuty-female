<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0369a1">
  <title>My Beauty App</title>

  <style>
    :root{
      --pink:#ff69b4;
      --purple:#b19cd9;
      --green:#98fb98;
      --blue-dark:#1e3a8a;
      --blue-light:#60a5fa;
      --blue-accent:#3b82f6;
      --card:#ffffff;
      --muted:#666;
    }

    html,body{height:100%;margin:0;padding:0}
    body {
      background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 25%, #0369a1 50%, #0284c7 75%, #06b6d4 100%);
      background-attachment: fixed;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 20px;
      color: #333;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      line-height:1.4;
    }

    a.skip-link{position: absolute;left: -9999px;top: auto;width: 1px;height: 1px;overflow: hidden}
    a.skip-link:focus{left: 10px;top: 10px;width:auto;height:auto;padding:8px 12px;background:#000;color:#fff;z-index:1000;border-radius:6px}

    /* truncated styles for brevity */
  </style>
</head>
<body>
  <!-- small floating install button -->
  <button id="installBtn" class="primary" style="display:none;position:fixed;top:16px;right:16px;z-index:5000;padding:10px 14px;border-radius:12px;">⬇️ Install App</button>

  <!-- content omitted for brevity: full app UI is in index.html -->

  <script src="./pwa-register.js"></script>
  <script>
    // Show install button when the beforeinstallprompt event was captured in pwa-register.js
    document.addEventListener('pwa:install-available', () => {
      const btn = document.getElementById('installBtn');
      if (btn) btn.style.display = 'inline-block';
    });

    // Click handler to prompt install
    document.getElementById('installBtn').addEventListener('click', async () => {
      if (typeof window.promptInstall !== 'function') {
        alert('Install not available in this browser');
        return;
      }
      try {
        const accepted = await window.promptInstall();
        if (accepted) {
          try { if (typeof showNotification === 'function') showNotification('App installed!', 'success'); else alert('App installed!'); } catch(e){ alert('App installed!'); }
        } else {
          try { if (typeof showNotification === 'function') showNotification('Install cancelled', 'warning'); else alert('Install cancelled'); } catch(e){ alert('Install cancelled'); }
        }
      } catch (err) {
        console.error('Install prompt failed', err);
        alert('Install failed');
      }
    });
  </script>
</body>
</html>
